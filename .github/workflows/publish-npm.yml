name: Publish anatomy-cli
run-name: npm ${{ inputs.channel || (startsWith(github.ref, 'refs/tags/canary-') && 'canary' || 'stable') }} from ${{ github.ref_name }}

on:
  push:
    branches: [main]
    tags: ['canary-*']
    paths:
      - 'apps/anatomy-cli/**'
      - 'packages/anatomy/**'
      - 'packages/schemas/**'
      - 'package.json'
      - 'bun.lock'
      - 'tsconfig.json'
      - '.nvmrc'
      - '.github/workflows/publish-npm.yml'
  workflow_dispatch:
    inputs:
      channel:
        description: 'stable increments 0.0.x; canary publishes only to the canary tag'
        type: choice
        options: [stable, canary]
        default: stable
        required: true

permissions:
  contents: read

concurrency:
  group: npm-publication
  cancel-in-progress: false

jobs:
  publish:
    if: github.repository == 'forge-town/anatomy-cli'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write
    env:
      RELEASE_CHANNEL: ${{ inputs.channel || (startsWith(github.ref, 'refs/tags/canary-') && 'canary' || 'stable') }}
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.11
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          registry-url: https://registry.npmjs.org
      - name: Validate channel and publication credentials
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [ "$RELEASE_CHANNEL" = stable ] && [ "$GITHUB_REF" != refs/heads/main ]; then
            echo '::error::Stable releases must run from main. Select channel=canary for a branch.'
            exit 1
          fi
          if [ -z "$NODE_AUTH_TOKEN" ]; then
            echo '::error::Configure NPM_TOKEN with publish access to anatomy-cli.'
            exit 1
          fi
          npm whoami --registry=https://registry.npmjs.org
      - run: bun install --frozen-lockfile
      - name: Test and build the source snapshot
        run: bun run quality
      - name: Prepare the next patch and verify packed consumers
        run: bun apps/anatomy-cli/src/release-main.ts prepare
      - name: Publish and verify registry consumers
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: bun apps/anatomy-cli/src/release-main.ts publish
      - name: Upload release plan, tarballs, and verification results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: npm-release-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            docs/verification/npm-release/artifacts/release-plan.json
            docs/verification/npm-release/artifacts/*.tgz
            docs/verification/npm-release/artifacts/*-consumer.json
          if-no-files-found: ignore
      - name: Summarize the verified release
        run: |
          echo '### Published and installed successfully' >> "$GITHUB_STEP_SUMMARY"
          cat docs/verification/npm-release/artifacts/registry-consumer.json >> "$GITHUB_STEP_SUMMARY"
